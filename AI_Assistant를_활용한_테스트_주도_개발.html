            {
                title: "결론: AI 시대, 개발자의 새로운 역할",
                content: `
                    <ul class="list-disc list-inside space-y-5 text-lg">
                        <li>TDAD는 AI의 폭발적인 생성 속도와 인간의 정교한 아키텍처 설계를 결합하는, 현재 가장 현실적이고 강력한 접근법입니다.</li>
                        <li>개발자의 역할은 변화하고 있습니다. 단순 '코드 타이피스트'에서 벗어나, <strong class="text-indigo-600">시스템의 목표를 정의하고 전체 구조를 설계하는 '시스템 아키텍트'</strong>로 진화해야 합니다.</li>
                        <li>'명세화(테스트) → 생성(AI) → 검증(테스트)'이라는 핵심 원칙은 앞으로의 소프트웨어 개발에서 품질을 보증하는 변치 않는 메커니즘이 될 것입니다.</li>
                    </ul>
                     <p class="text-xl font-bold text-center mt-10 p-4 bg-slate-100 text-slate-800 rounded-lg">AI에게 '어떻게'를 맡기고, 우리는 '무엇을'과 '왜'에 더 집중해야 합니다.</p>
                `
            }
        ];

        let currentSlide = 0;
        const totalSlides = presentationData.length;
        const container = document.getElementById('presentation-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const slideCounter = document.getElementById('slide-counter');

        function createSlides() {
            presentationData.forEach((slideData, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';
                slideEl.dataset.index = index;
                
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'slide-content';

                const titleEl = document.createElement('h2');
                if (slideData.title) {
                    titleEl.className = 'text-2xl md:text-3xl font-bold mb-6 text-slate-800';
                    titleEl.textContent = slideData.title;
                    contentWrapper.appendChild(titleEl);
                }

                const contentEl = document.createElement('div');
                contentEl.innerHTML = slideData.content;

                contentWrapper.appendChild(contentEl);
                slideEl.appendChild(contentWrapper);
                container.appendChild(slideEl);
            });
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            currentSlide = index;
            updateControls();
        }

        function updateControls() {
            slideCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === totalSlides - 1;
        }

        function changeSlide(direction) {
            const newSlide = currentSlide + direction;
            if (newSlide >= 0 && newSlide < totalSlides) {
                showSlide(newSlide);
            }
        }

        prevBtn.addEventListener('click', () => changeSlide(-1));
        nextBtn.addEventListener('click', () => changeSlide(1));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changeSlide(-1);
            } else if (e.key === 'ArrowRight') {
                changeSlide(1);
            }
        });
        
        // Initialize
        createSlides();
        showSlide(0);

    </script>
